<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTAオンライン・モンスターハンターワイルズ攻略wiki</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* （既存のスタイル） */
    .wiki-category-title {
        color: #22c55e; /* 緑 */
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 4px;
    }
    /* サブカテゴリ用の色（水色） */
    .wiki-subcategory-title {
        color: #38bdf8; 
        font-weight: bold;
        margin-top: 8px;
        margin-bottom: 2px;
        font-size: 12px;
    }
    
        .wiki-sidebar {
            width: 280px;
            flex-shrink: 0;
        }
        @media (max-width: 768px) {
            .wiki-sidebar {
                width: 100%;
            }
        }
        #wiki-menu {
            font-family: monospace, sans-serif;
            font-size: 13px;
            line-height: 1.6;
        }
        #wiki-menu a {
            color: #3b82f6;
            text-decoration: none;
        }
        #wiki-menu a:hover {
            text-decoration: underline;
            color: #ef4444;
        }
        .wiki-category-title {
            color: #22c55e;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

<!-- ヘッダー -->
<header class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
    <div>
        <h1 class="text-xl md:text-3xl font-bold tracking-tight">GTA & MH Wilds Wiki</h1>
    </div>
    <!-- スマホ用ハンバーガーボタン -->
    <button id="menu-btn" class="md:hidden text-white focus:outline-none bg-gray-700 p-2 rounded">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
</header>

<!-- メインコンテンツ領域 -->
<div class="flex flex-col md:flex-row flex-grow">
    
    <!-- 左側サイドバー（目次・メニュー） -->
    <aside id="sidebar" class="wiki-sidebar bg-gray-900 text-gray-300 p-6 shadow-lg fixed md:static inset-y-0 right-0 z-50 transform translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="flex justify-between items-center md:hidden mb-4">
            <span class="font-bold text-white">メニュー</span>
            <button id="close-btn" class="text-gray-400 hover:text-white">✕</button>
        </div>
        
        <nav class="space-y-6">
            <div id="wiki-menu">
                <div class="wiki-category-title">■トップページ</div>
                <ul class="space-y-0">
                    <li>
                        <a href="#" data-url="articles/top.html" class="ajax-link">├トップページ</a>
                    </li>
                </ul>
                <div class="wiki-category-title">■GTAオンライン</div>
        <ul class="space-y-0">
            <!-- ▼ サブカテゴリ「強盗」 -->
            <li>
                <div class="wiki-subcategory-title">└ 💰 強盗</div>
                <ul class="pl-4 space-y-0 border-l border-gray-700 ml-2">
                    <li>
                        <a href="#" data-url="articles/korutu.html" class="ajax-link">├コルツセンター強盗</a>
                    </li>
                    <!-- ここにほかの強盗記事も追加できるよ！ -->
                </ul>
            </li>
        </ul>
    </div>
</nav>
    </aside>

    <!-- 右側メイン記事表示エリア（枠をなくして画面いっぱいに！） -->
    <main class="flex-grow p-2 md:p-6 flex flex-col">
        <!-- 記事が自動で読み込まれるエリア（余白や白い枠を取り払って広々表示） -->
        <div id="wiki-content" class="w-full flex-grow flex flex-col"></div>
    </main>
</div>

<!-- フッター -->
<footer class="bg-gray-800 text-center text-gray-500 p-4 text-sm">
    &copy; 2026 Game Strategy Wiki. All Rights Reserved.
</footer>

<!-- 統合されたスマートなJavaScript -->
<script>
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const sidebar = document.getElementById('sidebar');
    const contentArea = document.getElementById('wiki-content');
    const ajaxLinks = document.querySelectorAll('.ajax-link');

    // メニューを開く
    menuBtn.addEventListener('click', () => {
        sidebar.classList.remove('translate-x-full');
    });

    // メニューを閉じる
    closeBtn.addEventListener('click', () => {
        sidebar.classList.add('translate-x-full');
    });

    // ページを読み込む関数
    function loadPage(url) {
        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error('ページの読み込みに失敗しました');
                return response.text();
            })
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // 記事側の body タグの中身をそのまま反映
                contentArea.innerHTML = doc.body.innerHTML;

                // 記事側の body に指定されている背景色やクラスをそのままコンテンツエリア全体に適用！
                contentArea.className = "w-full flex-grow flex flex-col " + doc.body.className;
            })
            .catch(error => {
                contentArea.innerHTML = '<p class="text-red-500 p-4">⚠️記事の読み込みにエラーが発生しました。記事が作成されていないか、端末のネットワーク環境に不具合が発生している場合があります。一度サイトを開きなおすかリロードをかけてみてください。リロードをかけてもエラーが出る場合は、記事が作成されていない場合が高いです。⚠️</p>';
                console.error(error);
            });
    }

    // 初回アクセス時にトップページを表示
    loadPage('articles/top.html');

    // メニューのリンクがクリックされたときの処理
    ajaxLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const url = link.getAttribute('data-url');
            loadPage(url);

            // スマホ表示のときはリンクをクリックしたら自動でメニューを閉じる
            if (window.innerWidth < 768) {
                sidebar.classList.add('translate-x-full');
            }
        });
    });
</script>

</body>
</html>
