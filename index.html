<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTAオンライン・モンスターハンターワイルズ攻略wiki</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wiki-sidebar {
            width: 280px;
            flex-shrink: 0;
        }
        @media (max-width: 768px) {
            .wiki-sidebar {
                width: 100%;
            }
        }
        /* --- ここから追加・変更したスタイル --- */
        #wiki-menu {
            font-family: monospace, sans-serif;
            font-size: 13px;
            line-height: 1.6;
        }
        #wiki-menu a {
            color: #3b82f6; /* Wiki風の青リンク */
            text-decoration: none;
        }
        #wiki-menu a:hover {
            text-decoration: underline;
            color: #ef4444;
        }
        /* 画像のような緑色の見出し */
        .wiki-category-title {
            color: #22c55e;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        /* --- ここまで --- */
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

<!-- ヘッダーの中にスマホ用メニューボタンを追加する例 -->
<header class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
    <div>
        <h1 class="text-xl md:text-3xl font-bold tracking-tight">GTA & MH Wilds Wiki</h1>
    </div>
    <!-- スマホ用ハンバーガーボタン -->
    <button id="menu-btn" class="md:hidden text-white focus:outline-none bg-gray-700 p-2 rounded">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
</header>

    <!-- メインコンテンツ領域 -->
    <div class="flex flex-col md:flex-row flex-grow">
        
        <!-- 左側サイドバー（目次・メニュー） -->
<!-- サイドバーのasideタグにスマホ用のクラスをあらかじめ付与しておく -->
<aside id="sidebar" class="wiki-sidebar bg-gray-900 text-gray-300 p-6 shadow-lg fixed md:static inset-y-0 right-0 z-50 transform translate-x-full md:translate-x-0 transition-transform duration-300">
    <!-- 閉じるボタンをサイドバー内に入れてあげると親切！ -->
    <div class="flex justify-between items-center md:hidden mb-4">
        <span class="font-bold text-white">メニュー</span>
        <button id="close-btn" class="text-gray-400 hover:text-white">✕</button>
    </div>
            
            <nav class="space-y-6">
                <!-- 目次部分 -->
                <div id="wiki-menu">
                    <!-- カテゴリ1 -->
                    <div class="wiki-category-title">■トップページ</div>
                    <ul class="space-y-0">
                        <li>
                            <a href="#" data-url="articles/top.html" class="ajax-link">├トップページ</a>
                        </li>
                    </ul>   
                </div>
            </nav>
        </aside>

        <!-- 右側メイン記事表示エリア（iframe） -->
        <main class="flex-grow p-4 md:p-8 flex flex-col">
            <div class="bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200 flex-grow flex flex-col">
                <iframe src="articles/top.html" name="wiki-content" class="w-full flex-grow min-h-[700px] border-0" title="content"></iframe>
            </div>
        </main>
    </div>

    <!-- フッター -->
    <footer class="bg-gray-800 text-center text-gray-500 p-4 text-sm">
        &copy; 2026 Game Strategy Wiki. All Rights Reserved.
    </footer>

    <script>
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const sidebar = document.getElementById('sidebar');

    // メニューを開く
    menuBtn.addEventListener('click', () => {
        sidebar.classList.remove('translate-x-full');
    });

    // メニューを閉じる
    closeBtn.addEventListener('click', () => {
        sidebar.classList.add('translate-x-full');
    });

    // メニュー内のリンクをクリックしたら自動でメニューを閉じる（スマホで便利！）
    const menuLinks = sidebar.querySelectorAll('a');
    menuLinks.forEach(link => {
        link.addEventListener('click', () => {
            sidebar.classList.add('translate-x-full');
        });
    });
</script>

<script>
    // 記事を表示するエリアと、すべてのメニューリンクを取得
    const contentArea = document.getElementById('wiki-content');
    const ajaxLinks = document.querySelectorAll('.ajax-link');

    // ページを開いた最初に「top.html」を自動で読み込む関数
    function loadPage(url) {
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('ページの読み込みに失敗しました');
                }
                return response.text();
            })
            .then(html => {
                // 読み込んだHTMLの中の <body> タグの中身だけを取り出して反映させるテクニック！
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // 記事側の <body class="..."> の中身をごっそりメインエリアに入れる
                contentArea.innerHTML = doc.body.innerHTML;
            })
            .catch(error => {
                contentArea.innerHTML = '<p class="text-red-500">記事の読み込みにエラーが発生しました。</p>';
                console.error(error);
            });
    }

    // サイトを開いた初回の読み込み
    loadPage('articles/top.html');

    // メニューのリンクがクリックされたときの処理
    ajaxLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault(); // ページがピュッと上に飛ぶのを防ぐ
            const url = link.getAttribute('data-url');
            loadPage(url);

            // もしスマホのメニューが開いていたら、リンクをクリックした時に自動で閉じるようにすると超親切！
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.add('translate-x-full'); // さっきのスマホ用メニュー閉じる処理
            }
        });
    });
</script>

</body>
</html>
